<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>daPhox</title>
  <link rel="icon" type="image/png" href="/daPhox.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0f0f0f;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .badge {
      position: relative;
      z-index: 1;
      max-width: 420px;
      width: 70%;

      /* start state */
      opacity: 0;
      transform: scale(0.97);

      /* intro + glow */
      animation:
        intro 1.6s ease-out forwards,
        glow 5.5s ease-in-out 1.8s infinite;
    }
    .badge img { display: block; width: 100%; height: auto; }
    .badge .hat {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      display: none;
    }
    .season-winter .badge .hat { display: block; }

    /* fade + settle */
    @keyframes intro {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* soft ambient glow */
    @keyframes glow {
  0%, 100% {
    filter:
      drop-shadow(0 0 14px var(--glow1))
      drop-shadow(0 0 28px var(--glow2));
  }
  50% {
    filter:
      drop-shadow(0 0 20px var(--glow3))
      drop-shadow(0 0 40px var(--glow4));
  }
}
    body { --glow1: rgba(255,90,60,.30); --glow2: rgba(255,90,60,.20); --glow3: rgba(255,90,60,.65); --glow4: rgba(255,90,60,.35); }
    body.season-winter { --glow1: rgba(150,200,255,.30); --glow2: rgba(150,200,255,.20); --glow3: rgba(170,215,255,.60); --glow4: rgba(150,200,255,.35); }
    body.season-spring { --glow1: rgba(255,140,190,.30); --glow2: rgba(255,140,190,.20); --glow3: rgba(255,150,200,.60); --glow4: rgba(255,140,190,.35); }
    body.season-summer { --glow1: rgba(255,200,70,.30);  --glow2: rgba(255,200,70,.20);  --glow3: rgba(255,210,80,.60);  --glow4: rgba(255,200,70,.35); }

    /* ---- seasonal decorations ---- */
    .layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .layer.back  { z-index: 0; }
    .layer.front { z-index: 2; }

    .deco {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      will-change: transform, opacity;
    }
    .deco svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .snow { border-radius: 50%; background: #fff; }
    .firefly {
      border-radius: 50%;
      background: #F1FFA8;
      box-shadow: 0 0 6px 2px rgba(225,255,120,.85), 0 0 18px 6px rgba(200,255,90,.35);
    }

    /* summer: red-white-blue glow */
    body.season-summer .badge {
      animation:
        intro 1.6s ease-out forwards,
        glowRWB 9s ease-in-out 1.8s infinite;
    }
    @keyframes glowRWB {
      0%, 100% { filter: drop-shadow(0 0 16px rgba(220,40,60,.55)) drop-shadow(0 0 34px rgba(220,40,60,.30)); }
      33%      { filter: drop-shadow(0 0 16px rgba(255,255,255,.45)) drop-shadow(0 0 34px rgba(255,255,255,.22)); }
      66%      { filter: drop-shadow(0 0 16px rgba(60,100,230,.60)) drop-shadow(0 0 34px rgba(60,100,230,.32)); }
    }

    /* animal visitors */
    .visitor { position: absolute; left: 0; top: 0; will-change: transform; }
    .visitor svg { display: block; width: 100%; height: auto; overflow: visible; }
    .legA, .legB, .tleg { transform-box: fill-box; transform-origin: 50% 0; }
    .trot .legA { animation: legSwing .36s ease-in-out infinite alternate; }
    .trot .legB { animation: legSwing .36s ease-in-out infinite alternate-reverse; }
    @keyframes legSwing { from { transform: rotate(-22deg); } to { transform: rotate(22deg); } }
    .tleg { animation: legSwing 1.1s ease-in-out infinite alternate; }
    .tleg.alt { animation-direction: alternate-reverse; }
    .wingflap { transform-box: fill-box; transform-origin: 0% 100%; animation: flap 1.4s ease-in-out infinite; }
    @keyframes flap { 0%, 60%, 100% { transform: scaleY(1); } 75% { transform: scaleY(.45); } 88% { transform: scaleY(1.05); } }
    .beewing { transform-box: fill-box; transform-origin: 50% 100%; animation: buzz .07s linear infinite alternate; }
    @keyframes buzz { from { transform: scaleY(1); } to { transform: scaleY(.35); } }
    .spark { border-radius: 50%; }

    /* fox trot */
    .fx .hip, .fx .knee, .fx .tail, .fx .bodyg, .fx .headg { transform-box: view-box; }
    .fx .hip  { animation: fxStride .62s linear infinite; }
    .fx .knee { animation: fxKnee .62s linear infinite; }
    .fx .d2   { animation-delay: -.31s; }
    .fx .bodyg { animation: fxBob .31s ease-in-out infinite alternate; }
    .fx .tail  { transform-origin: 88px 92px; animation: fxTail 1.24s ease-in-out infinite alternate; }
    .fx .headg { transform-origin: 222px 88px; animation: fxHead .62s ease-in-out infinite alternate; }
    @keyframes fxStride { 0% { transform: rotate(-26deg); } 55% { transform: rotate(22deg); } 100% { transform: rotate(-26deg); } }
    @keyframes fxKnee { 0%, 52% { transform: rotate(0); } 72% { transform: rotate(62deg); } 90% { transform: rotate(10deg); } 100% { transform: rotate(0); } }
    @keyframes fxBob { from { transform: translateY(0); } to { transform: translateY(-3px); } }
    @keyframes fxTail { from { transform: rotate(-4deg); } to { transform: rotate(5deg); } }
    @keyframes fxHead { from { transform: rotate(-1.5deg); } to { transform: rotate(1.5deg); } }

    /* accessibility: reduce motion */
    @media (prefers-reduced-motion: reduce) {
      .badge {
        animation: none;
        opacity: 1;
        transform: scale(1);
        filter: none;
      }
    }
  </style>
</head>
<body>

  <div class="layer back" id="back"></div>

  <div class="badge" id="logo">
    <img src="daPhox.png" alt="daPhox">
    <!-- Santa hat (winter only) -->
    <svg class="hat" viewBox="0 0 1024 1024" aria-hidden="true">
      <g transform="translate(0 8) rotate(-7 518 210)">
        <path d="M382,214 C384,130 450,62 548,52 C640,44 712,86 748,150 C716,130 680,124 660,140 C652,160 654,186 660,210 Z"
              fill="#D6262B" stroke="#111" stroke-width="9" stroke-linejoin="round"/>
        <path d="M560,62 C640,60 700,96 735,140 C705,126 676,124 660,138 C640,110 610,80 560,62 Z" fill="#A3161C"/>
        <path d="M362,206 C360,186 380,178 400,180 C470,176 560,174 640,176 C664,176 682,186 680,206 C682,228 664,238 640,238 C560,240 470,240 400,238 C378,238 362,228 362,206 Z"
              fill="#F7F7F7" stroke="#111" stroke-width="9" stroke-linejoin="round"/>
        <path d="M380,224 C460,232 580,232 664,222" fill="none" stroke="#D2D6DC" stroke-width="7" stroke-linecap="round"/>
        <circle cx="752" cy="158" r="34" fill="#F7F7F7" stroke="#111" stroke-width="9"/>
        <path d="M736,174 C748,182 764,180 774,170" fill="none" stroke="#D2D6DC" stroke-width="6" stroke-linecap="round"/>
      </g>
    </svg>
  </div>

  <div class="layer front" id="front"></div>

  <script>
  (function () {
    /* ---------- which season is it? ----------
       Dec-Feb winter, Mar-May spring, Jun-Aug summer, Sep-Nov fall.
       Preview any season with ?season=winter (or spring, summer, fall). */
    var SEASONS = ['winter', 'winter', 'spring', 'spring', 'spring', 'summer',
                   'summer', 'summer', 'fall', 'fall', 'fall', 'winter'];
    var override = (location.search.match(/season=(winter|spring|summer|fall)/) || [])[1];
    var season = override || SEASONS[new Date().getMonth()];
    document.body.classList.add('season-' + season);

    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var logo = document.getElementById('logo');
    var back = document.getElementById('back');
    var front = document.getElementById('front');

    function rand(a, b) { return a + Math.random() * (b - a); }
    function pick(list) { return list[Math.floor(Math.random() * list.length)]; }

    /* ---------- shapes (drawn in a -60..60 box) ---------- */
    var MAPLE = 'M0,-50 L8,-35 L16,-38 L12,-14 L28,-28 L32,-20 L46,-24 L40,-8 L48,-4 L26,14 L30,24 L4,20 L3,46 L-3,46 L-4,20 L-30,24 L-26,14 L-48,-4 L-40,-8 L-46,-24 L-32,-20 L-28,-28 L-12,-14 L-16,-38 L-8,-35 Z';
    var MAPLE_VEINS = 'M0,40 L0,-42 M0,8 L38,-14 M0,8 L-38,-14 M0,18 L24,20 M0,18 L-24,20';
    var OVAL = 'M0,-50 C32,-28 30,24 0,44 C-30,24 -32,-28 0,-50 Z M0,44 L0,56';
    var OVAL_VEINS = 'M0,52 L0,-40 M0,0 L14,-14 M0,0 L-14,-14 M0,18 L14,4 M0,18 L-14,4';
    var HOLLY = 'M-50,0 Q-40,-14 -30,-8 Q-25,-22 -12,-14 Q-4,-26 6,-14 Q16,-24 24,-10 Q36,-18 50,0 Q36,18 24,10 Q16,24 6,14 Q-4,26 -12,14 Q-25,22 -30,8 Q-40,14 -50,0 Z';
    var PETAL = 'M0,-30 C20,-16 16,18 0,30 C-16,18 -20,-16 0,-30 Z';

    var LEAF_COLORS = {
      rust: ['#B8321E', '#7A1E12'], orange: ['#E2621B', '#9C3A0E'], amber: ['#EE9A1C', '#A8600C'],
      gold: ['#F4C542', '#B08414'], brown: ['#9A5523', '#5E3010'],
      green: ['#4FA83D', '#2E6B22'], lime: ['#8CC63F', '#5A8A1E'], deep: ['#2F7D32', '#1B4D1E']
    };

    function leafSVG(kind, color) {
      var c = LEAF_COLORS[color];
      return '<path d="' + (kind === 'oval' ? OVAL : MAPLE) + '" fill="' + c[0] + '" stroke="#111" stroke-width="5" stroke-linejoin="round"/>' +
             '<path d="' + (kind === 'oval' ? OVAL_VEINS : MAPLE_VEINS) + '" fill="none" stroke="' + c[1] + '" stroke-width="3" stroke-linecap="round"/>';
    }
    function flowerSVG(petals, rx, ry, cy, fill, center, centerR, dots) {
      var s = '';
      for (var i = 0; i < petals; i++) {
        s += '<ellipse cx="0" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '" transform="rotate(' + (360 / petals * i) + ')" fill="' + fill + '" stroke="#111" stroke-width="4"/>';
      }
      s += '<circle r="' + centerR + '" fill="' + center + '" stroke="#111" stroke-width="4"/>';
      if (dots) for (var j = 0; j < 5; j++) {
        var a = j * 72 * Math.PI / 180;
        s += '<circle cx="' + (Math.sin(a) * centerR * 1.7).toFixed(1) + '" cy="' + (-Math.cos(a) * centerR * 1.7).toFixed(1) + '" r="3.5" fill="' + dots + '"/>';
      }
      return s;
    }
    var SHAPES = {
      blossom: function (shade) { return flowerSVG(5, 20, 26, -24, shade || '#F9C4D6', '#D6457A', 9, '#FFE07A'); },
      daisy:   function () { return flowerSVG(12, 8, 24, -28, '#FFFFFF', '#F4B400', 16); },
      holly:   function () {
        return '<g transform="rotate(-28) translate(-26,-6) scale(0.75)"><path d="' + HOLLY + '" fill="#2E7D32" stroke="#111" stroke-width="6" stroke-linejoin="round"/><path d="M-44,0 L44,0" stroke="#1B5E20" stroke-width="4"/></g>' +
               '<g transform="rotate(28) translate(26,-6) scale(0.75)"><path d="' + HOLLY + '" fill="#388E3C" stroke="#111" stroke-width="6" stroke-linejoin="round"/><path d="M-44,0 L44,0" stroke="#1B5E20" stroke-width="4"/></g>' +
               '<circle cx="-9" cy="10" r="11" fill="#D32F2F" stroke="#111" stroke-width="4"/>' +
               '<circle cx="10" cy="12" r="11" fill="#C62828" stroke="#111" stroke-width="4"/>' +
               '<circle cx="0" cy="-5" r="11" fill="#E53935" stroke="#111" stroke-width="4"/>';
      },
      flake: function () {
        var arms = '';
        for (var i = 0; i < 6; i++) {
          arms += '<g transform="rotate(' + (i * 60) + ')"><path d="M0,0 L0,-46 M0,-22 L-12,-34 M0,-22 L12,-34 M0,-36 L-8,-44 M0,-36 L8,-44"/></g>';
        }
        return '<g fill="none" stroke-linecap="round"><g stroke="#111" stroke-width="12">' + arms + '</g><g stroke="#EAF4FF" stroke-width="6">' + arms + '</g></g>';
      },
      star: function (fill) {
        return '<path d="M0,-48 L13,-16 L47,-15 L21,6 L29,40 L0,21 L-29,40 L-21,6 L-47,-15 L-13,-16 Z" fill="' + fill + '" stroke="#111" stroke-width="6" stroke-linejoin="round"/>';
      },
      flag: function () {
        var stripes = '', stars = '';
        for (var i = 0; i < 7; i++) stripes += '<rect y="' + (i * 8) + '" width="84" height="4" fill="#C8102E"/>';
        var rows = [[6, 14, 22, 30], [10, 18, 26], [6, 14, 22, 30], [10, 18, 26]];
        rows.forEach(function (r, ri) { r.forEach(function (x) { stars += '<circle cx="' + x + '" cy="' + (5 + ri * 6) + '" r="1.8"/>'; }); });
        return '<path d="M-42,-52 L-42,56" stroke="#111" stroke-width="9" stroke-linecap="round"/>' +
               '<path d="M-42,-52 L-42,56" stroke="#8D6E63" stroke-width="5" stroke-linecap="round"/>' +
               '<circle cx="-42" cy="-54" r="5" fill="#F4B400" stroke="#111" stroke-width="3"/>' +
               '<g transform="translate(-40,-48)"><rect width="84" height="52" fill="#fff"/>' + stripes +
               '<rect width="36" height="28" fill="#1F3A93"/><g fill="#fff">' + stars + '</g>' +
               '<rect width="84" height="52" fill="none" stroke="#111" stroke-width="4"/></g>';
      },
      petal: function (shade) {
        return '<path d="' + PETAL + '" fill="' + shade + '" stroke="#7a2a48" stroke-width="3"/><path d="M0,-18 L0,18" stroke="rgba(214,69,122,.5)" stroke-width="3"/>';
      }
    };

    function makeDeco(inner, size, layer, cls) {
      var el = document.createElement('div');
      el.className = 'deco' + (cls ? ' ' + cls : '');
      el.style.width = el.style.height = size + 'px';
      if (inner) el.innerHTML = '<svg viewBox="-60 -60 120 120">' + inner + '</svg>';
      layer.appendChild(el);
      return el;
    }
    function place(el, x, y, size, rot, opacity, flip) {
      el.style.width = el.style.height = size + 'px';
      el.style.transform = 'translate(' + (x - size / 2) + 'px,' + (y - size / 2) + 'px) rotate(' + rot + 'deg)' +
        (flip !== undefined ? ' scale(' + flip + ',1)' : '');
      el.style.opacity = opacity;
    }

    /* ---------- decorations around the badge, per season ----------
       x, y, s are fractions of the logo's width; r is rotation.
       The 'front' item covers the little sparkle on the left. */
    var SPARKLE = { x: 0.234, y: 0.502, s: 0.085, front: true };
    function L(kind, color) { return function () { return leafSVG(kind, color); }; }

    var CONFIG = {
      fall: {
        drops: true,
        cluster: [
          [0.125, 0.649, 0.182, -35, L('maple', 'rust')],
          [0.216, 0.768, 0.153, 15,  L('maple', 'amber')],
          [0.051, 0.535, 0.125, -75, L('oval', 'gold')],
          [0.068, 0.763, 0.114, -10, L('oval', 'brown')],
          [0.864, 0.234, 0.182, 30,  L('maple', 'orange')],
          [0.949, 0.370, 0.142, 72,  L('maple', 'gold')],
          [0.744, 0.115, 0.119, 10,  L('oval', 'rust')],
          [0.960, 0.189, 0.108, 55,  L('oval', 'brown')],
          [0.159, 0.183, 0.108, -25, L('oval', 'amber')],
          [0.892, 0.723, 0.119, 40,  L('maple', 'rust')]
        ],
        sparkle: L('maple', 'orange'),
        particle: 'leaf', max: 22, every: [0.5, 1.4]
      },
      winter: {
        cluster: [
          [0.075, 0.700, 0.240, -20, SHAPES.holly],
          [0.060, 0.540, 0.110, 10,  SHAPES.flake],
          [0.215, 0.790, 0.110, 25,  SHAPES.flake],
          [0.925, 0.700, 0.240, 25,  SHAPES.holly],
          [0.950, 0.560, 0.105, -15, SHAPES.flake],
          [0.120, 0.230, 0.120, 0,   SHAPES.flake],
          [0.930, 0.300, 0.095, 20,  SHAPES.flake]
        ],
        sparkle: SHAPES.flake,
        particle: 'snow', max: 130, every: [0.04, 0.12], prefill: 80
      },
      spring: {
        cluster: [
          [0.120, 0.650, 0.170, -10, function () { return SHAPES.blossom(); }],
          [0.215, 0.775, 0.135, 20,  function () { return SHAPES.blossom('#FFD6E4'); }],
          [0.050, 0.540, 0.110, -60, L('oval', 'green')],
          [0.070, 0.770, 0.110, -20, function () { return SHAPES.blossom('#F48FB1'); }],
          [0.865, 0.235, 0.170, 15,  function () { return SHAPES.blossom(); }],
          [0.950, 0.365, 0.130, 40,  function () { return SHAPES.blossom('#FFD6E4'); }],
          [0.750, 0.110, 0.110, 20,  L('oval', 'lime')],
          [0.960, 0.190, 0.100, 60,  L('oval', 'green')],
          [0.160, 0.185, 0.110, -15, function () { return SHAPES.blossom('#F48FB1'); }],
          [0.890, 0.725, 0.120, 30,  function () { return SHAPES.blossom(); }]
        ],
        sparkle: function () { return SHAPES.blossom('#FFD6E4'); },
        particle: 'petal', max: 60, every: [0.12, 0.35], prefill: 35
      },
      summer: {
        cluster: [
          [0.080, 0.640, 0.230, -12, SHAPES.flag],
          [0.925, 0.640, 0.230, 12,  SHAPES.flag],
          [0.205, 0.800, 0.120, 15,  SHAPES.daisy],
          [0.800, 0.810, 0.115, -10, SHAPES.daisy],
          [0.864, 0.234, 0.150, 15,  function () { return SHAPES.star('#C8102E'); }],
          [0.955, 0.360, 0.105, -8,  function () { return SHAPES.star('#FFFFFF'); }],
          [0.744, 0.110, 0.100, -12, function () { return SHAPES.star('#2348B8'); }],
          [0.159, 0.183, 0.130, -15, function () { return SHAPES.star('#2348B8'); }],
          [0.060, 0.420, 0.090, 12,  function () { return SHAPES.star('#C8102E'); }],
          [0.270, 0.080, 0.080, 20,  function () { return SHAPES.star('#FFFFFF'); }]
        ],
        sparkle: function () { return SHAPES.star('#FFFFFF'); },
        particle: 'bee', max: 7, every: [0.4, 1.0], prefill: 5,
        fireworks: true,
        visitors: ['bunny', 'turtle', 'eagle']
      }
    };
    var cfg = CONFIG[season];

    /* ---------- animal visitors ---------- */
    function foxLeg(x, y, upper, near, cls, hind) {
      var dark = near ? '#20150f' : '#140d09', up = near ? 'url(#fxLegUp)' : '#7a2d10';
      var kx = x + (hind ? -3 : 1), fx = x + (hind ? 2 : 1);
      return '<g class="hip ' + cls + '" style="transform-origin:' + x + 'px ' + y + 'px">' +
        '<path d="M' + x + ',' + (y - 6) + ' L' + kx + ',' + (y + upper) + '" stroke="#0d0907" stroke-width="' + (hind ? 19 : 15) + '" stroke-linecap="round"/>' +
        '<path d="M' + x + ',' + (y - 6) + ' L' + kx + ',' + (y + upper) + '" stroke="' + up + '" stroke-width="' + (hind ? 13 : 10) + '" stroke-linecap="round"/>' +
        '<g class="knee ' + cls + '" style="transform-origin:' + kx + 'px ' + (y + upper) + 'px">' +
        '<path d="M' + kx + ',' + (y + upper) + ' L' + fx + ',' + (y + upper + 38) + '" stroke="#0d0907" stroke-width="12" stroke-linecap="round"/>' +
        '<path d="M' + kx + ',' + (y + upper) + ' L' + fx + ',' + (y + upper + 38) + '" stroke="' + dark + '" stroke-width="7" stroke-linecap="round"/>' +
        '<ellipse cx="' + (x + (hind ? 6 : 5)) + '" cy="' + (y + upper + 40) + '" rx="9" ry="4.5" fill="' + dark + '" stroke="#0d0907" stroke-width="2.5"/>' +
        '</g></g>';
    }
    function foxSVG() {
      var hat = season === 'winter' ?
        '<g transform="translate(240,30) rotate(-14)"><path d="M-20,12 C-16,-12 2,-28 26,-26 C18,-16 14,-2 20,12 Z" fill="#D6262B" stroke="#0d0907" stroke-width="4" stroke-linejoin="round"/>' +
        '<rect x="-25" y="6" width="50" height="13" rx="6.5" fill="#F7F7F7" stroke="#0d0907" stroke-width="4"/>' +
        '<circle cx="27" cy="-26" r="7" fill="#F7F7F7" stroke="#0d0907" stroke-width="3.5"/></g>' : '';
      return '<svg viewBox="0 0 300 200">' +
        '<defs><linearGradient id="fxBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B8441A"/><stop offset=".55" stop-color="#E5672A"/><stop offset="1" stop-color="#F08A45"/></linearGradient>' +
        '<linearGradient id="fxTailG" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#C9501F"/><stop offset=".7" stop-color="#E87332"/><stop offset="1" stop-color="#B8441A"/></linearGradient>' +
        '<linearGradient id="fxLegUp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9501F"/><stop offset="1" stop-color="#3a1d10"/></linearGradient>' +
        '<radialGradient id="fxEye" cx=".45" cy=".45" r=".6"><stop offset="0" stop-color="#F5C04A"/><stop offset="1" stop-color="#B9711A"/></radialGradient></defs>' +
        '<ellipse cx="150" cy="190" rx="110" ry="5" fill="rgba(0,0,0,.35)"/>' +
        '<g class="bodyg">' +
        foxLeg(108, 106, 36, false, 'd2', true) + foxLeg(206, 104, 36, false, '', false) +

      }

      // animal visitors
      if (!visitor && visitorPool.length && t >= nextVisitor) {
        var kind = pick(visitorPool), V = VISITORS[kind];
        var vw = Math.min(V.w[1], Math.max(Math.min(V.w[0], W() * 0.36), W() * 0.17));
        var dir = Math.random() < 0.5 ? 1 : -1;
        var vEl = document.createElement('div');
        vEl.className = 'visitor ' + (V.cls || '');
        vEl.style.width = vw + 'px';
        vEl.innerHTML = V.svg();
        (V.sky ? back : front).appendChild(vEl);
        var vh = vEl.offsetHeight || vw * 0.6;
        visitor = { el: vEl, V: V, w: vw, h: vh, dir: dir, x: dir > 0 ? -vw - 20 : W() + 20,
                    baseY: V.sky ? rand(H() * 0.06, H() * 0.25) : H() - vh - 6, t: 0 };
      }
      if (visitor) {
        var v = visitor;
        v.t += dt;
        var vy = v.baseY, rot = 0, sx = 1, sy = 1;
        if (v.V.hop) {
          var period = 0.62, ph = (v.t % period) / period;
          var air = ph < 0.72, p2 = ph / 0.72;
          if (air) {
            vy -= Math.sin(Math.PI * p2) * 42;
            rot = (0.5 - p2) * -26;
            sx = 1 + 0.10 * Math.sin(Math.PI * p2); sy = 1 - 0.06 * Math.sin(Math.PI * p2);
            v.x += v.dir * v.V.speed * 1.35 * dt;
          } else { sx = 1.04; sy = 0.94; }
        } else if (v.V.sky) {
          vy += Math.sin(v.t * 0.9) * 18;
          rot = Math.cos(v.t * 0.9) * 4;
          v.x += v.dir * v.V.speed * dt;
        } else {
          v.x += v.dir * v.V.speed * dt;
        }
        v.el.style.transformOrigin = '50% 100%';
        v.el.style.transform = 'translate(' + v.x + 'px,' + vy + 'px) scale(' + (sx * v.dir) + ',' + sy + ') rotate(' + rot + 'deg)';
        if ((v.dir > 0 && v.x > W() + 30) || (v.dir < 0 && v.x < -v.w - 30)) {
          v.el.remove();
          visitor = null;
          nextVisitor = t + (forceV ? 1 : rand(cfg.visitors ? 14 : 22, cfg.visitors ? 28 : 40));
        }
      }

      var free = 0;
      for (var j = 0; j < parts.length; j++) if (!parts[j].owner && !parts[j].spark) free++;
      if (t >= nextSpawn && free < cfg.max) {
        spawn(false);
        nextSpawn = t + rand(cfg.every[0], cfg.every[1]);
      }

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
  </script>
